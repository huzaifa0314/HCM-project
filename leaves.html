
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management | HCM Lite</title>
  <link rel="stylesheet" href="css/dark-mode.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #182230;
    }
    header {
      background: #172554;
      color: #fff;
      padding: 22px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 22px; }
    header a { color: white; }
    main { max-width: 1100px; margin: 28px auto; padding: 0 18px; }
    .card {
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px #1725540a;
    }
    .muted { color: #64748b; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }
    label { display: block; font-weight: bold; margin-bottom: 7px; }
    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 100px; }
    .field { margin-bottom: 15px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      background: #2563eb;
      color: white;
      margin: 2px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .approve { background: #15803d; }
    .reject { background: #b91c1c; }
    .notice { padding: 12px; border-radius: 8px; margin: 14px 0; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    .quota { font-size: 18px; font-weight: bold; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
    th { background: #f8fafc; font-size: 13px; }
    .pill {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
    }
    .comment { font-size: 13px; color: #475569; margin-top: 6px; white-space: pre-wrap; }
    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 16px; }
      main { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>HCM Lite — Leave Management</h1>
    <a id="backLink" href="admin.html">Back to Dashboard</a>
  </header>

  <main>
    <section class="card">
      <h2 id="pageHeading">Leave Management</h2>
      <p id="intro" class="muted">Leave requests aur unka status.</p>
      <p id="message" aria-live="polite"></p>
    </section>

    <section class="card" id="applyPanel" hidden>
      <h2>Apply for Leave</h2>
      <p id="quotaInfo" class="quota">Annual quota: loading...</p>
      <p class="muted">
        Working days hi count honge. Submit karne se pehle dates aur reason check kar lein.
      </p>

      <form id="leaveForm">
        <div class="grid">
          <div class="field">
            <label for="startDate">Start Date</label>
            <input id="startDate" name="startDate" type="date" required>
          </div>
          <div class="field">
            <label for="endDate">End Date</label>
            <input id="endDate" name="endDate" type="date" required>
          </div>
        </div>

        <div class="field">
          <label for="reason">Reason for Leave</label>
          <textarea id="reason" name="reason" maxlength="500"
            placeholder="Apni leave ki wajah likhein..." required></textarea>
        </div>

        <p id="dayPreview" class="muted">Working days: —</p>
        <button type="submit">Submit Leave Request</button>
      </form>
    </section>

    <section class="card">
      <h2 id="listHeading">Leave Requests</h2>
      <p id="listDescription" class="muted"></p>
      <div class="table-wrap">
        <table>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="leaveRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leave.js"></script>
  <script>
    (function () {
      "use strict";

      const message = document.getElementById("message");
      const rows = document.getElementById("leaveRows");
      const form = document.getElementById("leaveForm");
      let currentUser = null;

      function escapeHTML(value) {
        if (window.HCMUtils &&
            typeof HCMUtils.escapeHTML === "function") {
          return HCMUtils.escapeHTML(String(value ?? ""));
        }

        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;",
          '"': "&quot;", "'": "&#39;"
        })[char]);
      }

      function localToday() {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type ? "notice " + type : "";
      }

      function formatStatus(status) {
        return `<span class="pill">${escapeHTML(status || "Pending")}</span>`;
      }

      function refreshQuota() {
        const year = new Date().getFullYear();
        const remaining = HCMLeave.getRemainingDays(currentUser.id, year);

        document.getElementById("quotaInfo").textContent =
          `Annual leave remaining in ${year}: ${remaining} day(s)`;

        return remaining;
      }

      function updateDayPreview() {
        const start = document.getElementById("startDate").value;
        const end = document.getElementById("endDate").value;
        const preview = document.getElementById("dayPreview");

        if (!start || !end) {
          preview.textContent = "Working days: —";
          return;
        }

        try {
          const days = HCMLeave.countWorkingDays(start, end);
          preview.textContent = `Selected working days: ${days}`;
        } catch (error) {
          preview.textContent = error.message;
        }
      }

      function renderEmployeeLeaves() {
        document.getElementById("tableHead").innerHTML =
          "<th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th>Admin Comment</th>";

        document.getElementById("listDescription").textContent =
          "Yahan sirf aapki apni leave requests dikh rahi hain.";

        const leaves = HCMLeave.getMyLeaves();

        rows.innerHTML = leaves.length
          ? leaves.map(leave => `
              <tr>
                <td>${escapeHTML(leave.startDate)}<br>to<br>${escapeHTML(leave.endDate)}</td>
                <td>${escapeHTML(leave.days)}</td>
                <td>${escapeHTML(leave.reason)}</td>
                <td>${formatStatus(leave.status)}</td>
                <td>${escapeHTML(leave.adminComment || "—")}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="5">Abhi koi leave request nahi hai.</td></tr>';

        refreshQuota();
      }

      function renderAdminLeaves() {
        document.getElementById("tableHead").innerHTML =
          "<th>Employee</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status / Comment</th><th>Action</th>";

        document.getElementById("listDescription").textContent =
          "Pending requests ko approve ya reject karein. Comment optional hai.";

        const leaves = HCMLeave.getAllLeaves();

        rows.innerHTML = leaves.length
          ? leaves.map(leave => `
              <tr>
                <td>${escapeHTML(leave.employeeName)}<br><small>${escapeHTML(leave.employeeEmail)}</small></td>
                <td>${escapeHTML(leave.startDate)}<br>to<br>${escapeHTML(leave.endDate)}</td>
                <td>${escapeHTML(leave.days)}</td>
                <td>${escapeHTML(leave.reason)}</td>
                <td>
                  ${formatStatus(leave.status)}
                  <div class="comment">${escapeHTML(leave.adminComment || "")}</div>
                </td>
                <td>
                  ${leave.status === "Pending" ? `
                    <button class="approve" data-action="Approved" data-id="${escapeHTML(leave.id)}">Approve</button>
                    <button class="reject" data-action="Rejected" data-id="${escapeHTML(leave.id)}">Reject</button>
                  ` : "Reviewed"}
                </td>
              </tr>
            `).join("")
          : '<tr><td colspan="6">Abhi koi leave request nahi hai.</td></tr>';
      }

      try {
        if (!HCMAuth.requireAuth(["admin", "employee"])) return;

        currentUser = HCMAuth.getCurrentUser();

        if (!currentUser) {
          showMessage("Login session nahi mili. Dobara login karein.", "error");
          return;
        }

        document.getElementById("startDate").min = localToday();
        document.getElementById("endDate").min = localToday();

        if (currentUser.role === "employee") {
          document.getElementById("applyPanel").hidden = false;
          document.getElementById("pageHeading").textContent = "My Leave";
          document.getElementById("intro").textContent =
            "Leave request submit karein aur apna status check karein.";
          document.getElementById("backLink").href = "employee.html";
          document.getElementById("backLink").textContent = "Back to Employee Dashboard";
          document.getElementById("listHeading").textContent = "My Leave Requests";
          renderEmployeeLeaves();
        } else if (currentUser.role === "admin") {
          document.getElementById("pageHeading").textContent = "Manage Employee Leaves";
          document.getElementById("intro").textContent =
            "Employee leave requests review karein.";
          renderAdminLeaves();
        } else {
          showMessage("Is account ko leave management access nahi hai.", "error");
          return;
        }

        document.getElementById("startDate").addEventListener("change", updateDayPreview);
        document.getElementById("endDate").addEventListener("change", updateDayPreview);

        form.addEventListener("submit", event => {
          event.preventDefault();

          if (currentUser.role !== "employee") return;

          try {
            HCMLeave.applyLeave({
              startDate: document.getElementById("startDate").value,
              endDate: document.getElementById("endDate").value,
              reason: document.getElementById("reason").value
            });

            form.reset();
            document.getElementById("startDate").min = localToday();
            document.getElementById("endDate").min = localToday();
            updateDayPreview();
            renderEmployeeLeaves();
            showMessage("Leave request submit ho gayi.", "success");
          } catch (error) {
            showMessage(error.message || "Leave request submit nahi ho saki.", "error");
          }
        });

        rows.addEventListener("click", event => {
          const button = event.target.closest("button[data-action]");
          if (!button || currentUser.role !== "admin") return;

          const decision = button.dataset.action;
          const leaveId = button.dataset.id;

          let comment = "";
          if (decision === "Rejected") {
            comment = prompt("Rejection ki wajah ya comment likhein (optional):") || "";
          } else {
            comment = prompt("Admin comment (optional):") || "";
          }

          try {
            HCMLeave.reviewLeave(leaveId, decision, comment);
            renderAdminLeaves();
            showMessage(
              decision === "Approved"
                ? "Leave approve ho gayi."
                : "Leave reject ho gayi.",
              "success"
            );
          } catch (error) {
            showMessage(error.message || "Request review nahi ho saki.", "error");
          }
        });
      } catch (error) {
        showMessage(
          "Leave page load nahi hua: " +
          (error.message || "Unknown error") +
          ". Check karein ke storage.js aur auth.js theek load ho rahe hain.",
          "error"
        );
      }
    })();
  </script>
  <script src="js/helper.js"></script>
  <script src="js/dark-mode.js"></script>
</body>
</html>
